name: NodeJS Build (Vite)

on:
  push:
    branches: [ "main", "feat/local-spherex-datasets" ]
  pull_request:
    branches: [ "main", "feat/spherex-judges-demo-mode" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm ci --include=dev
        npm run lint
        npm run build
