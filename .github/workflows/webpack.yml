name: NodeJS Build (Vite) + Python Science Tests

on:
  push:
    branches: ["main", "feat/spherex-judges-demo-mode"]
  pull_request:
    branches: ["main", "science-hardening-phase1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-star-orbit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Typecheck, test and build production app
        run: npm run build

  python-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-science.txt

      - name: Install scientific dependencies
        run: python -m pip install -r requirements-science.txt

      - name: Run offline scientific regression tests
        run: python -m unittest discover -s tests_science -v

      - name: Verify research CLI is available
        run: python -m science.pipeline --help
