name: NodeJS Build (Vite)

on:
  push:
    branches: ["main", "feat/spherex-judges-demo-mode"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: black-star-orbit-ci-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Typecheck, test and build production app
        run: npm run build
